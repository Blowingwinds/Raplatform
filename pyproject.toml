[project]
name = "raplatform"
version = "0.1.0"
description = "Agent-oriented automated penetration testing platform prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
